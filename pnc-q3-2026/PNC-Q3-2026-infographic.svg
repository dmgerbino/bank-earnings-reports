<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>PNC Q3 2026 earnings: EPS beat, lowest charge-offs of six peers, thinnest capital</title>
<desc>Adjusted EPS $5.09 beat estimates of $4.91 to $4.98. Net interest income $4.21 billion, up 15.3% year over year; revenue missed estimates by 0.7%. Net charge-offs 0.28% of loans, lowest of six super-regional banks. CET1 9.8%, lowest of six, versus a 6.5% well-capitalized minimum.</desc>
<rect width="1080" height="1350" fill="#000000"/>
