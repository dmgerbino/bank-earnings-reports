<text x="1016" y="468" font-size="40" font-weight="600" fill="#3DD68C" text-anchor="end">▲ +2.2% vs. est.</text>
<text x="64" y="522" font-size="40" font-weight="600" fill="#F0EDEA">Adjusted EPS vs. estimates</text>
<text x="64" y="564" font-size="40" font-weight="400" fill="#888580">Est. $4.91 to $4.98</text>
</g>
