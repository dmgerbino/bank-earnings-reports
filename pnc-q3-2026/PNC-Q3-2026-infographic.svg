<text x="64" y="184" font-size="64" font-weight="700" fill="#F0EDEA">PNC beat on EPS with the</text>
<text x="64" y="260" font-size="64" font-weight="700" fill="#F0EDEA">lowest charge-offs of six</text>
<text x="64" y="336" font-size="64" font-weight="700" fill="#F0EDEA">peers, but the thinnest capital</text>
</g>
