<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Merchants &amp; Marine Bancorp Q3 2026: the FM Bank deal lifted revenue, but costs rose faster</title>
<desc>Net income $1.46M, up 2.8%; no analyst estimate exists. Revenue $16.28M, up 36.8%, fastest of four Gulf South banks. Efficiency ratio 87.1%, worse by 2.8 points, highest of four. Loans 30-89 days past due 2.54% of loans, up from 1.70% in June; nonaccrual 1.87%.</desc>
<rect width="1080" height="1350" fill="#000000"/>
<g id="tier-0"><text x="64" y="104" font-size="40" font-weight="600" fill="#5B9BD5">MNMB · Q3 2026 earnings</text>
<text x="64" y="184" font-size="64" font-weight="700" fill="#F0EDEA">The FM Bank deal lifted</text>
<text x="64" y="260" font-size="64" font-weight="700" fill="#F0EDEA">revenue, but costs rose</text>
<text x="64" y="336" font-size="64" font-weight="700" fill="#F0EDEA">faster: profit barely grew</text>
</g>
<g id="tier-1">
<rect x="40" y="376" width="1000" height="196" rx="16" fill="#0D0D0D"/>
<text x="64" y="472" font-size="88" font-weight="700" fill="#F0EDEA">$1.46M</text>
<text x="1016" y="468" font-size="40" font-weight="600" fill="#3DD68C" text-anchor="end">▲ +2.8% YoY</text>
<text x="64" y="522" font-size="40" font-weight="600" fill="#F0EDEA">Q3 net income</text>
<text x="64" y="564" font-size="40" font-weight="400" fill="#888580">No analyst estimate found</text>
</g>
<g id="tier-2">
<rect x="40" y="588" width="1000" height="196" rx="16" fill="#0D0D0D"/>
<text x="64" y="684" font-size="88" font-weight="700" fill="#F0EDEA">$16.3M</text>
<text x="1016" y="680" font-size="40" font-weight="600" fill="#3DD68C" text-anchor="end">▲ +36.8% YoY</text>
<text x="64" y="734" font-size="40" font-weight="600" fill="#F0EDEA">Revenue</text>
<text x="64" y="776" font-size="40" font-weight="400" fill="#888580">#1 of 4 Gulf South banks</text>
</g>
<g id="tier-3">
<rect x="40" y="800" width="1000" height="196" rx="16" fill="#0D0D0D"/>
<text x="64" y="896" font-size="88" font-weight="700" fill="#F0EDEA">87.1%</text>
<text x="1016" y="892" font-size="40" font-weight="600" fill="#FF6B52" text-anchor="end">▲ +2.8 pts, worse</text>
<text x="64" y="946" font-size="40" font-weight="600" fill="#F0EDEA">Efficiency ratio</text>
<text x="64" y="988" font-size="40" font-weight="400" fill="#888580">Highest of 4; peers 66-86%</text>
</g>
<g id="tier-4">
<rect x="40" y="1012" width="1000" height="196" rx="16" fill="#0D0D0D"/>
<text x="64" y="1108" font-size="88" font-weight="700" fill="#F0EDEA">2.54%</text>
<text x="1016" y="1104" font-size="40" font-weight="600" fill="#FF6B52" text-anchor="end">▲ from 1.70% Jun</text>
<text x="64" y="1158" font-size="40" font-weight="600" fill="#F0EDEA">Loans 30-89 days past due</text>
<text x="64" y="1200" font-size="40" font-weight="400" fill="#888580">Nonaccrual 1.87% of loans</text>
</g>
