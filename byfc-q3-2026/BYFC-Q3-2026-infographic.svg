<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Broadway Financial Q3 2026: deposits grew 31% in a year, but Broadway had the thinnest margin and second-highest cost ratio of its peers</title>
<desc>Diluted EPS $0.04, up from $0.02 in Q2; no consensus estimate found. Deposits $1.11 billion, up 30.7% year over year; loans up 11.6% to $1.14 billion. Efficiency ratio 80.2%, up from 71.6% in Q2, against a 55.2% peer median. Net interest margin 2.64%, down 8 basis points, lowest of three peers with a verified margin.</desc>
<rect width="1080" height="1350" fill="#000000"/>
