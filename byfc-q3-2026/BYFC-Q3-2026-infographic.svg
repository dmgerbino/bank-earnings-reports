<text x="64" y="184" font-size="64" font-weight="700" fill="#F0EDEA">Deposits grew 31%, but</text>
<text x="64" y="260" font-size="64" font-weight="700" fill="#F0EDEA">Broadway ran the thinnest</text>
<text x="64" y="336" font-size="64" font-weight="700" fill="#F0EDEA">margin of its peers</text>
</g>
