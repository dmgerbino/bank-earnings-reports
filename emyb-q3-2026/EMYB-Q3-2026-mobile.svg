<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Embassy Bancorp Q3 2026: fastest profit growth of three Pennsylvania banks, on the thinnest margin</title>
<desc>EPS $0.66, up 32% from $0.50; no analyst estimate exists. Net income $4.9 million, up 28.0%, fastest of three Pennsylvania banks. Bank-level margin 2.84%, up 32 basis points but lowest of three. Unrealized securities losses $66.3 million; equity down 7.7% since December.</desc>
<rect width="1080" height="1350" fill="#000000"/>
<g id="tier-0"><text x="64" y="104" font-size="40" font-weight="600" fill="#5B9BD5">EMYB · Q3 2026 earnings</text>
<text x="64" y="184" font-size="64" font-weight="700" fill="#F0EDEA">Fastest profit growth of</text>
<text x="64" y="260" font-size="64" font-weight="700" fill="#F0EDEA">3 Pennsylvania banks,</text>
<text x="64" y="336" font-size="64" font-weight="700" fill="#F0EDEA">on the thinnest margin</text>
</g>
<g id="tier-1">
<rect x="40" y="376" width="1000" height="196" rx="16" fill="#0D0D0D"/>
<text x="64" y="472" font-size="88" font-weight="700" fill="#F0EDEA">$0.66</text>
<text x="1016" y="468" font-size="40" font-weight="600" fill="#3DD68C" text-anchor="end">▲ +32.0% YoY</text>
<text x="64" y="522" font-size="40" font-weight="600" fill="#F0EDEA">EPS, basic and diluted</text>
<text x="64" y="564" font-size="40" font-weight="400" fill="#888580">No analyst estimate found</text>
</g>
<g id="tier-2">
<rect x="40" y="588" width="1000" height="196" rx="16" fill="#0D0D0D"/>
<text x="64" y="684" font-size="88" font-weight="700" fill="#F0EDEA">$4.9M</text>
<text x="1016" y="680" font-size="40" font-weight="600" fill="#3DD68C" text-anchor="end">▲ +28.0% YoY</text>
<text x="64" y="734" font-size="40" font-weight="600" fill="#F0EDEA">Net income</text>
<text x="64" y="776" font-size="40" font-weight="400" fill="#888580">#1 of 3 PA banks on growth</text>
</g>
<g id="tier-3">
<rect x="40" y="800" width="1000" height="196" rx="16" fill="#0D0D0D"/>
<text x="64" y="896" font-size="88" font-weight="700" fill="#F0EDEA">2.84%</text>
<text x="1016" y="892" font-size="40" font-weight="600" fill="#3DD68C" text-anchor="end">▲ +32 bp YoY</text>
<text x="64" y="946" font-size="40" font-weight="600" fill="#F0EDEA">Net interest margin (bank)</text>
<text x="64" y="988" font-size="40" font-weight="400" fill="#888580">Lowest of 3; peers 3.86-4.54%</text>
</g>
<g id="tier-4">
