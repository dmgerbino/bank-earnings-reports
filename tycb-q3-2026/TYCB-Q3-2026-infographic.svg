<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Calvin B. Taylor Q3 2026: most profitable of four Maryland banks, but the slowest profit growth</title>
<desc>EPS $1.62, up 5.9% from $1.53; no analyst estimate exists. Return on assets 1.59%, best of four Maryland banks. Net interest income $10.2 million, up 10.1%, while expenses rose 12.6%. Nonperforming loans 0.83% of loans, up from 0.19%.</desc>
<rect width="1080" height="1350" fill="#000000"/>
<g id="tier-0"><text x="64" y="104" font-size="40" font-weight="600" fill="#5B9BD5">TYCB · Q3 2026 earnings</text>
<text x="64" y="184" font-size="64" font-weight="700" fill="#F0EDEA">Most profitable of 4</text>
<text x="64" y="260" font-size="64" font-weight="700" fill="#F0EDEA">Maryland banks, but the</text>
<text x="64" y="336" font-size="64" font-weight="700" fill="#F0EDEA">slowest profit growth</text>
</g>
<g id="tier-1">
<rect x="40" y="376" width="1000" height="196" rx="16" fill="#0D0D0D"/>
<text x="64" y="472" font-size="88" font-weight="700" fill="#F0EDEA">$1.62</text>
<text x="1016" y="468" font-size="40" font-weight="600" fill="#3DD68C" text-anchor="end">▲ +5.9% YoY</text>
<text x="64" y="522" font-size="40" font-weight="600" fill="#F0EDEA">EPS, basic and diluted</text>
<text x="64" y="564" font-size="40" font-weight="400" fill="#888580">No analyst estimate found</text>
</g>
<g id="tier-2">
<rect x="40" y="588" width="1000" height="196" rx="16" fill="#0D0D0D"/>
<text x="64" y="684" font-size="88" font-weight="700" fill="#F0EDEA">1.59%</text>
<text x="1016" y="680" font-size="40" font-weight="600" fill="#FF6B52" text-anchor="end">▼ −6 bp YoY</text>
<text x="64" y="734" font-size="40" font-weight="600" fill="#F0EDEA">Return on average assets</text>
<text x="64" y="776" font-size="40" font-weight="400" fill="#888580">#1 of 4 Maryland banks</text>
</g>
<g id="tier-3">
<rect x="40" y="800" width="1000" height="196" rx="16" fill="#0D0D0D"/>
<text x="64" y="896" font-size="88" font-weight="700" fill="#F0EDEA">$10.2M</text>
<text x="1016" y="892" font-size="40" font-weight="600" fill="#3DD68C" text-anchor="end">▲ +10.1% YoY</text>
<text x="64" y="946" font-size="40" font-weight="600" fill="#F0EDEA">Net interest income</text>
<text x="64" y="988" font-size="40" font-weight="400" fill="#888580">Expenses rose faster: +12.6%</text>
</g>
<g id="tier-4">
<rect x="40" y="1012" width="1000" height="196" rx="16" fill="#0D0D0D"/>
<text x="64" y="1108" font-size="88" font-weight="700" fill="#F0EDEA">0.83%</text>
<text x="1016" y="1104" font-size="40" font-weight="600" fill="#F5A623" text-anchor="end">◆ was 0.19%</text>
<text x="64" y="1158" font-size="40" font-weight="600" fill="#F0EDEA">Nonperforming to loans</text>
<text x="64" y="1200" font-size="40" font-weight="400" fill="#888580">Net charge-offs only $9K</text>
</g>
