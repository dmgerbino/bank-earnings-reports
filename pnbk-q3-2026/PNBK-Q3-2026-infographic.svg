<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Patriot National Bancorp Q3 2026: interest income more than doubled, but costs ate 94 cents of each revenue dollar</title>
<desc>Net interest income $10.7 million, up 114.4% year over year. Net income $1.2 million versus a $2.7 million loss a year earlier. Efficiency ratio 94.0%, highest of four Connecticut, New York and New Jersey community banks (peer median 56.1%). Other income $3.1 million versus $0.1 million a year earlier, 18.5% of revenue. No consensus estimate found.</desc>
<rect width="1080" height="1350" fill="#000000"/>
<g id="tier-0"><text x="64" y="104" font-size="40" font-weight="600" fill="#5B9BD5">PNBK · Q3 2026 earnings</text>
<text x="64" y="184" font-size="64" font-weight="700" fill="#F0EDEA">Interest income doubled,</text>
<text x="64" y="260" font-size="64" font-weight="700" fill="#F0EDEA">but costs still ate 94 cents</text>
<text x="64" y="336" font-size="64" font-weight="700" fill="#F0EDEA">of every revenue dollar</text>
</g>
