<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Waterstone Financial Q3 2026: the margin rose again, but a mortgage loss cut EPS 20% and left WSBF last of four Wisconsin peers</title>
<desc>Diluted EPS $0.36, down 20% from $0.45; the only estimate found, MarketBeat's $0.66, looks stale. Net interest margin 3.06%, up 30 basis points, lowest of four Wisconsin banks. Mortgage segment net loss of $0.47 million versus a $0.95 million profit a year ago. Nonperforming assets 0.55% of assets, up from 0.27%.</desc>
<rect width="1080" height="1350" fill="#000000"/>
<g id="tier-0"><text x="64" y="104" font-size="40" font-weight="600" fill="#5B9BD5">WSBF · Q3 2026 earnings</text>
<text x="64" y="184" font-size="64" font-weight="700" fill="#F0EDEA">Margin rose again, but a</text>
<text x="64" y="260" font-size="64" font-weight="700" fill="#F0EDEA">mortgage loss cut EPS</text>
<text x="64" y="336" font-size="64" font-weight="700" fill="#F0EDEA">20%, last of 4 peers</text>
</g>
<g id="tier-1">
<rect x="40" y="376" width="1000" height="196" rx="16" fill="#0D0D0D"/>
<text x="64" y="472" font-size="88" font-weight="700" fill="#F0EDEA">$0.36</text>
<text x="1016" y="468" font-size="40" font-weight="600" fill="#FF6B52" text-anchor="end">▼ −20% YoY</text>
<text x="64" y="522" font-size="40" font-weight="600" fill="#F0EDEA">Diluted EPS</text>
<text x="64" y="564" font-size="40" font-weight="400" fill="#888580">Only estimate $0.66, stale</text>
</g>
