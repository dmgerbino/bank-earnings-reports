<text x="1016" y="680" font-size="40" font-weight="600" fill="#3DD68C" text-anchor="end">▲ +30 bp YoY</text>
<text x="64" y="734" font-size="40" font-weight="600" fill="#F0EDEA">Net interest margin</text>
<text x="64" y="776" font-size="40" font-weight="400" fill="#888580">Lowest of 4 Wisconsin banks</text>
</g>
<g id="tier-3">
<rect x="40" y="800" width="1000" height="196" rx="16" fill="#0D0D0D"/>
<text x="64" y="896" font-size="88" font-weight="700" fill="#F0EDEA">−$0.47M</text>
<text x="1016" y="892" font-size="40" font-weight="600" fill="#FF6B52" text-anchor="end">▼ was +$0.95M</text>
<text x="64" y="946" font-size="40" font-weight="600" fill="#F0EDEA">Mortgage segment result</text>
<text x="64" y="988" font-size="40" font-weight="400" fill="#888580">Originations −18% vs Q2</text>
</g>
<g id="tier-4">
<rect x="40" y="1012" width="1000" height="196" rx="16" fill="#0D0D0D"/>
