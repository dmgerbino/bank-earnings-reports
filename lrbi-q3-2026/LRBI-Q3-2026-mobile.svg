<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Lake Ridge Bancorp Q3 2026: earnings up 26%, but costs still run above Wisconsin peers</title>
<desc>EPS $4.97, up 26.1% from $3.94; no analyst estimate exists. Revenue $33.5 million, up 16.6%, second of four Wisconsin banks. Computed efficiency ratio 62.9%, improved 2.9 points but highest of four. Nonperforming loans 0.26% of loans, down from 0.47% at year end.</desc>
<rect width="1080" height="1350" fill="#000000"/>
<g id="tier-0"><text x="64" y="104" font-size="40" font-weight="600" fill="#5B9BD5">LRBI · Q3 2026 earnings</text>
<text x="64" y="184" font-size="64" font-weight="700" fill="#F0EDEA">Earnings up 26%, but</text>
<text x="64" y="260" font-size="64" font-weight="700" fill="#F0EDEA">costs still run above</text>
<text x="64" y="336" font-size="64" font-weight="700" fill="#F0EDEA">Wisconsin peers</text>
</g>
