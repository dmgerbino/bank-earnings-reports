<text x="1016" y="468" font-size="40" font-weight="600" fill="#3DD68C" text-anchor="end">▲ +26.1% YoY</text>
<text x="64" y="522" font-size="40" font-weight="600" fill="#F0EDEA">EPS</text>
<text x="64" y="564" font-size="40" font-weight="400" fill="#888580">No analyst estimate found</text>
</g>
