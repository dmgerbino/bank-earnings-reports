<rect x="40" y="588" width="1000" height="196" rx="16" fill="#0D0D0D"/>
<text x="64" y="684" font-size="88" font-weight="700" fill="#F0EDEA">$33.5M</text>
<text x="1016" y="680" font-size="40" font-weight="600" fill="#3DD68C" text-anchor="end">▲ +16.6% YoY</text>
<text x="64" y="734" font-size="40" font-weight="600" fill="#F0EDEA">Revenue (NII + fees)</text>
<text x="64" y="776" font-size="40" font-weight="400" fill="#888580">#2 of 4 Wisconsin banks</text>
</g>
<g id="tier-3">
<rect x="40" y="800" width="1000" height="196" rx="16" fill="#0D0D0D"/>
<text x="64" y="896" font-size="88" font-weight="700" fill="#F0EDEA">62.9%</text>
<text x="1016" y="892" font-size="40" font-weight="600" fill="#3DD68C" text-anchor="end">▼ −2.9 pts YoY</text>
<text x="64" y="946" font-size="40" font-weight="600" fill="#F0EDEA">Efficiency ratio (computed)</text>
<text x="64" y="988" font-size="40" font-weight="400" fill="#888580">Highest of 4; median 55.1%</text>
</g>
