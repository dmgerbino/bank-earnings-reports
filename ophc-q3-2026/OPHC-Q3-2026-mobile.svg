<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>OptimumBank Holdings Q3 2026: a record quarter that beat the Street and led its Florida peers</title>
<desc>Diluted EPS $0.30 versus a $0.27 Zacks consensus. Revenue $19.6 million, up 50.6% year over year, against an 8.1% peer median. Net interest margin 4.63%, up 26 basis points, highest of four Florida banks; efficiency ratio 45.9%, also best of four. Reserve fell to 0.89% of loans from 1.23% while loans grew 68%.</desc>
